name: Build HCR-S.TEC
on:
  workflow_dispatch:
  push:
    branches: [ principal ]
jobs:
  build-windows:
    runs-on: windows-2022
    env:
      GYP_MSVS_VERSION: '2022'
      npm_config_msvs_version: '2022'
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source
        shell: pwsh
        run: |
          cmd /c "copy /b HCR-S.TEC-source.part1+HCR-S.TEC-source.part2 HCR-S.TEC-source.zip"
          Expand-Archive HCR-S.TEC-source.zip -DestinationPath src
          git clone --depth 1 https://github.com/openinterpreter/interpreter-workstation.git upstream
          if (Test-Path upstream/apps/interpreter-extension/playwriter) {
            New-Item -ItemType Directory -Force src/apps/interpreter-extension | Out-Null
            Copy-Item upstream/apps/interpreter-extension/playwriter src/apps/interpreter-extension -Recurse -Force
          }
          if (Test-Path upstream/resources/browser-extension-relay) {
            New-Item -ItemType Directory -Force src/resources | Out-Null
            Copy-Item upstream/resources/browser-extension-relay src/resources -Recurse -Force
          }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/openinterpreter/interpreter-workstation/main/package.json" -OutFile "src/package.json"
          Get-Content src/package.json -Raw | ConvertFrom-Json | Out-Null
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: src
      - run: pnpm rebuild interpreter-window-pin
        working-directory: src
      - run: pnpm run download:oix -- --current-platform
        working-directory: src
      - run: pnpm run download:pdfcpu -- --current-platform
        working-directory: src
      - run: pnpm run download:qwen-asr -- --current-platform
        working-directory: src
      - run: pnpm run build
        working-directory: src
      - uses: actions/upload-artifact@v4
        with:
          name: HCR-S.TEC-windows
          path: src/release/**
