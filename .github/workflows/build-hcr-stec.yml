name: Build HCR-S.TEC
on:
  workflow_dispatch:
  push:
    branches: [ principal ]
jobs:
  build-windows:
    runs-on: windows-2022
    env:
      GYP_MSVS_VERSION: '2022'
      npm_config_msvs_version: '2022'
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and patch source
        shell: pwsh
        run: |
          cmd /c "copy /b HCR-S.TEC-source.part1+HCR-S.TEC-source.part2 HCR-S.TEC-source.zip"
          Expand-Archive HCR-S.TEC-source.zip -DestinationPath src
          New-Item -ItemType Directory -Force src/apps/interpreter-extension/playwriter | Out-Null
          '{"name":"interpreter-playwriter","version":"0.0.0","private":true}' | Set-Content src/apps/interpreter-extension/playwriter/package.json
          New-Item -ItemType Directory -Force src/resources/browser-extension-relay/node_modules/hono | Out-Null
          New-Item -ItemType Directory -Force src/resources/browser-extension-relay/dist/extension | Out-Null
          '{"name":"browser-extension-relay","version":"0.0.0","private":true}' | Set-Content src/resources/browser-extension-relay/package.json
          '{"name":"hono","version":"4.0.0","private":true}' | Set-Content src/resources/browser-extension-relay/node_modules/hono/package.json
          '{}' | Set-Content src/resources/browser-extension-relay/runtime-manifest.json
          '{"name":"browser-extension-relay","version":"0.0.0","manifest_version":3}' | Set-Content src/resources/browser-extension-relay/manifest.json
          'console.log("HCR-S.TEC browser extension relay");' | Set-Content src/resources/browser-extension-relay/dist/start-relay-server.js
          '{"manifest_version":3,"name":"HCR-S.TEC Browser Relay","version":"0.0.0"}' | Set-Content src/resources/browser-extension-relay/dist/extension/manifest.json
          $p = Get-Content src/product.json -Raw | ConvertFrom-Json
          $p.nameShort = 'HCR-S.TEC'
          $p.nameLong = 'HCR-S.TEC'
          $p.applicationName = 'hcr-s-tec'
          $p.dataFolderName = '.hcr-s-tec'
          $p.win32DirName = 'HCR-S.TEC'
          $p.win32NameVersion = 'HCR-S.TEC'
          $p.win32AppUserModelId = 'Aurora.HCRSTEC'
          $p.urlProtocol = 'hcr-stec'
          $p | ConvertTo-Json -Depth 100 | Set-Content src/product.json
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/openinterpreter/interpreter-workstation/main/package.json" -OutFile "src/package.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: src
      - run: pnpm rebuild interpreter-window-pin
        working-directory: src
      - run: pnpm run download:oix -- --current-platform
        working-directory: src
      - run: pnpm run download:pdfcpu -- --current-platform
        working-directory: src
      - run: pnpm run download:qwen-asr -- --current-platform
        working-directory: src
      - name: Build and package Windows application
        shell: pwsh
        run: |
          pnpm run ensure:js-repl-runtime-assets
          pnpm run build:renderer
          pnpm run build:electron
          pnpm exec electron-builder --win --publish never
        working-directory: src
      - uses: actions/upload-artifact@v4
        with:
          name: HCR-S.TEC-windows
          path: src/release/**
